<text x="56" y="556" font-family="Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1f2933" text-anchor="start">Связи (внешние ключи):</text>
<text x="56" y="580" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="start">users 1 - N tasks:  fk_tasks_user (tasks.user_id → users.id), ON DELETE SET NULL - задача остаётся без владельца</text>
<text x="56" y="600" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="start">task_statuses 1 - N tasks:  fk_tasks_status (tasks.status_code → task_statuses.code)</text>
<text x="56" y="620" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="normal" fill="#1f2933" text-anchor="start">tasks N - M tags через task_tags:  fk_task_tags_task, fk_task_tags_tag, ON DELETE CASCADE</text>
<text x="1124" y="556" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="normal" fill="#52606d" text-anchor="end">PK - первичный ключ   FK - внешний ключ   UQ - уникальное   NN - NOT NULL</text>
